name: iPhone build and TestFlight

# Every push to main (or a claude/ branch) builds the iPhone app to check it compiles.
# A commit message whose first line contains [upload] (or a manual run with "upload" ticked)
# also signs the app and sends it to TestFlight.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Bundle the JavaScript for iPhone
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"

  ios:
    needs: typecheck
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Only the first line of the commit message counts, so a description
      # that mentions [upload] doesn't send a build by accident.
      - name: Decide whether to upload
        env:
          MANUAL_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          UPLOAD=false
          if [ "$MANUAL_UPLOAD" = "true" ]; then UPLOAD=true; fi
          case "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)" in
            *"[upload]"*) UPLOAD=true ;;
          esac
          echo "UPLOAD=$UPLOAD" >> "$GITHUB_ENV"
          echo "Upload to TestFlight: $UPLOAD"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm install --no-audit --no-fund
      - name: Generate the Xcode project
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
      - name: Find workspace and set build number
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "ios/$SCHEME/Info.plist"
      - name: Build for iPhone simulator
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80
      - name: Check upload credentials
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          for key in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key GitHub secret"
              exit 1
            fi
          done
      - name: Register the bundle ID with Apple
        if: env.UPLOAD == 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/apple-api"
          "$RUNNER_TEMP/apple-api/bin/pip" -q install 'PyJWT[crypto]'
          "$RUNNER_TEMP/apple-api/bin/python" tools/register_bundle_id.py
      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            archive | tail -n 80
          cat > "$RUNNER_TEMP/Export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
